      - name: Pasang icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          SRC=assets/icons/icon-512.png
          R=android-app/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; px=${d##*:}
            fg=$((px*108/48)); inner=$((fg*62/100))
            dir=$R/mipmap-$name
            mkdir -p $dir
            convert $SRC -resize ${px}x${px} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            convert $SRC -resize ${inner}x${inner} -background none -gravity center -extent ${fg}x${fg} $dir/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > $R/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1CB5FD</color>
          </resources>
          EOF

