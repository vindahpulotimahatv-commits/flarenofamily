<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Orang Tua</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e90ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flareno Jurnal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h2>👨‍👩‍👧 Dashboard Orang Tua</h2>
  <button id="logoutBtn" class="btn-secondary">Keluar</button>
</header>

<main class="admin-container">
  <p id="loadingMsg">Memuat data anak...</p>
  <div id="childrenGrid" class="children-grid"></div>

  <section class="section-block">
    <h3>🕵️ Approval Bukti Foto</h3>
    <div id="approvalQueue" class="approval-queue"><p class="muted">Memuat...</p></div>
  </section>
</main>

<script type="module">
  import { guardPage, logout } from "./js/auth.js";
  import { loadChildren } from "./js/admin.js";

  document.getElementById("logoutBtn").addEventListener("click", logout);

  guardPage("admin", async (user, userData) => {
    document.getElementById("loadingMsg").textContent = "";
    await loadChildren();
  });
</script>

</body>
</html>
