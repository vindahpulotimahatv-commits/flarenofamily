<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Harian Keluarga - Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6fb;
    color: #1f2937;
  }
  .login-box {
    max-width: 380px;
    margin: 60px auto;
    background: white;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  .login-box h1 { margin-bottom: 4px; font-size: 22px; }
  .subtitle { color: #6b7280; margin-bottom: 24px; font-size: 14px; }
  .login-box label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    margin: 12px 0 4px;
  }
  .login-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  .login-box button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-box button:hover { background: #4338ca; }
  .error { color: #dc2626; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>

<div class="login-box">
  <h1>🎯 Misi Harian Keluarga</h1>
  <p class="subtitle">Login untuk masuk ke dashboard</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="contoh: admin@keluarga.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="Password">

    <button type="submit">Masuk</button>
  </form>

  <p id="errorMsg" class="error"></p>
</div>

<script type="module">
  import { login } from "./js/auth.js";

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await login(email, password); // login() sudah otomatis redirect ke admin.html / child.html
    } catch (err) {
      errorMsg.textContent = "Login gagal: " + err.message;
    }
  });
</script>

</body>
</html>
