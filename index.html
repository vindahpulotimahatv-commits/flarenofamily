<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flareno Jurnal - Login</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e90ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flareno Jurnal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-box">

    <div class="brand-lockup">
      <div class="brand-crown">👑</div>
      <h1 class="brand-logo">
        <span class="brand-flareno">FLARENO</span>
        <span class="brand-jurnal">JURNAL</span>
      </h1>
      <p class="brand-tagline">Jadi Anak Hebat Setiap Hari</p>
    </div>

    <div class="login-card">
      <p class="login-eyebrow">🎯 Misi Harian Keluarga</p>
      <p class="subtitle">Login untuk masuk ke dashboard</p>

      <form id="loginForm">
        <label for="email">✉️ Email</label>
        <input type="email" id="email" required placeholder="contoh: admin@keluarga.com">

        <label for="password">🔒 Password</label>
        <input type="password" id="password" required placeholder="Password">

        <button type="submit" class="btn-game-primary">➜ Masuk</button>
      </form>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>
</div>

<script type="module">
  import { login } from "./js/auth.js";

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await login(email, password); // login() sudah otomatis redirect ke admin.html / child.html
    } catch (err) {
      errorMsg.textContent = "Login gagal: " + err.message;
    }
  });
</script>

</body>
</html>
