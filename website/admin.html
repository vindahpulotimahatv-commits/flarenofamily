<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Orang Tua</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h2>👨‍👩‍👧 Dashboard Orang Tua</h2>
  <button id="logoutBtn" class="btn-secondary">Keluar</button>
</header>

<main class="admin-container">
  <p id="loadingMsg">Memuat data anak...</p>
  <div id="childrenGrid" class="children-grid"></div>
</main>

<script type="module">
  import { guardPage, logout } from "./js/auth.js";
  import { loadChildren } from "./js/admin.js";

  document.getElementById("logoutBtn").addEventListener("click", logout);

  guardPage("admin", async (user, userData) => {
    document.getElementById("loadingMsg").textContent = "";
    await loadChildren();
  });
</script>

</body>
</html>
