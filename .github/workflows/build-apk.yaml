          package com.flareno.jurnal

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Config {
              const val SITE_URL = "https://vindahpulotimahatv-commits.github.io/flarenofamily/"
              const val SITE_HOST = "vindahpulotimahatv-commits.github.io"
              const val PROJECT_ID = "misi-harian-keluarga"
              private const val PREFS = "flareno"

              fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              // Status aplikasi (dipakai service untuk memutuskan boleh mengunci atau tidak)
              @Volatile var appForeground = false
              @Volatile var keepUntil = 0L
              @Volatile var graceUntil = 0L

              fun isMonitoring(c: Context): Boolean {
                  val p = prefs(c)
                  val rt = p.getString("refreshToken", "") ?: ""
                  if (rt.isEmpty()) return false
                  val childId = p.getString("childId", "") ?: ""
                  return p.getString("mode", "child") == "admin" || childId.isNotEmpty()
              }

              fun todayStr(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())

              fun statusText(status: String): String = when (status) {
                  "terbatas" -> "HP terbatas. Selesaikan misi untuk membuka kembali."
                  "terkunci" -> "HP dikunci. Tugas belum diselesaikan."
                  "habis" -> "Waktu HP hari ini sudah habis."
                  else -> "HP kembali aktif. Semua aman, main sewajarnya ya!"
              }
          }
